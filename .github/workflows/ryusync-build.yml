name: RyuSync Builds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ryusync-netplay-v1

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: RyuSync-Windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            artifact: RyuSync-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET version
        run: dotnet --info

      - name: Test RyuSync controller transport
        run: dotnet run --project tests/RyuSync.NetworkTests -c Release

      - name: Build verified LibHac source
        shell: bash
        run: |
          set -euxo pipefail

          # This source and commit were verified through GitHub before this
          # workflow was committed. Do not add fallback mirrors here.
          LIBHAC_REPO="https://github.com/sinjunyoung/RomForge.git"
          LIBHAC_COMMIT="8202eb04c7158906171d07e40a0530f0f5d41f34"
          LIBHAC_VERSION="0.21.1"
          LIBHAC_DIR="$RUNNER_TEMP/ryusync-libhac"

          rm -rf "$LIBHAC_DIR" "$GITHUB_WORKSPACE/.packages"
          mkdir -p "$GITHUB_WORKSPACE/.packages"

          # Keep LibHac outside the RyuSync source tree so RyuSync's
          # Directory.Packages.props cannot alter LibHac's package semantics.
          git clone --filter=blob:none --no-checkout "$LIBHAC_REPO" "$LIBHAC_DIR"
          git -C "$LIBHAC_DIR" fetch --depth=1 origin "$LIBHAC_COMMIT"
          git -C "$LIBHAC_DIR" checkout --detach "$LIBHAC_COMMIT"
          test "$(git -C "$LIBHAC_DIR" rev-parse HEAD)" = "$LIBHAC_COMMIT"

          # RomForge carries extra NSZ compression code on top of LibHac.
          # Ryujinx does not need that code, and it introduces RomForge-only
          # dependencies. Remove only those additions before packing LibHac.
          rm -rf "$LIBHAC_DIR/LibHac/Nsz"

          LIBHAC_DIR="$LIBHAC_DIR" python - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          project = Path(os.environ['LIBHAC_DIR']) / 'LibHac' / 'LibHac.csproj'
          tree = ET.parse(project)
          root = tree.getroot()

          for item_group in list(root.findall('ItemGroup')):
              for child in list(item_group):
                  include = child.attrib.get('Include', '')
                  if child.tag == 'PackageReference' and include in {'Blake3', 'ZstdSharp.Port'}:
                      item_group.remove(child)
                  elif child.tag == 'ProjectReference':
                      item_group.remove(child)
              if len(item_group) == 0:
                  root.remove(item_group)

          tree.write(project, encoding='utf-8', xml_declaration=True)
          PY

          # Only the local feed and nuget.org are available to this build.
          dotnet restore "$LIBHAC_DIR/LibHac/LibHac.csproj" \
            --configfile "$GITHUB_WORKSPACE/nuget.ci.config"

          dotnet pack "$LIBHAC_DIR/LibHac/LibHac.csproj" \
            -c Release --no-restore \
            -o "$GITHUB_WORKSPACE/.packages" \
            -p:PackageId=Ryujinx.LibHac \
            -p:Version="$LIBHAC_VERSION"

          test -f "$GITHUB_WORKSPACE/.packages/Ryujinx.LibHac.${LIBHAC_VERSION}.nupkg"
          ls -la "$GITHUB_WORKSPACE/.packages"

      - name: Select verified LibHac version for CI
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('Directory.Packages.props')
          text = path.read_text(encoding='utf-8')
          old = '<PackageVersion Include="Ryujinx.LibHac" Version="0.21.0-alpha.133" />'
          new = '<PackageVersion Include="Ryujinx.LibHac" Version="0.21.1" />'
          if old not in text:
              raise SystemExit('Expected Ryujinx.LibHac 0.21.0-alpha.133 pin was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Restore RyuSync without git.ryujinx.app
        run: dotnet restore src/Ryujinx/Ryujinx.csproj --configfile nuget.ci.config -r ${{ matrix.rid }}

      - name: Publish Ryujinx
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o publish/${{ matrix.rid }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
