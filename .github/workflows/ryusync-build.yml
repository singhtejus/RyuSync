name: RyuSync Builds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ryusync-netplay-v1

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: RyuSync-Windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            artifact: RyuSync-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET version
        run: dotnet --info

      - name: Build pinned LibHac from source
        shell: bash
        run: |
          set -euxo pipefail

          LIBHAC_COMMIT="e39169ab5053ff179b7fef38f624dfc608d2596c"
          rm -rf .ci-libhac .packages
          mkdir -p .packages

          # Ryubing moved LibHac to its own repository after the original
          # upstream disappeared. Try the surviving/current locations, but
          # accept a repository only if it contains the exact revision used
          # by Ryubing when it introduced 0.21.0-alpha.133.
          found=0
          for repo in \
            https://git.greemdev.net/projects/LibHac.git \
            https://git.greemdev.net/projects/libhac.git \
            https://git.ryujinx.app/ryubing/libhac.git \
            https://git.ryujinx.app/projects/LibHac.git
          do
            echo "Trying LibHac source: $repo"
            rm -rf .ci-libhac

            if ! git clone "$repo" .ci-libhac; then
              continue
            fi

            if git -C .ci-libhac cat-file -e "${LIBHAC_COMMIT}^{commit}" 2>/dev/null; then
              git -C .ci-libhac checkout --detach "$LIBHAC_COMMIT"
              found=1
              break
            fi

            echo "Repository does not contain required LibHac revision $LIBHAC_COMMIT"
          done

          if [ "$found" -ne 1 ]; then
            echo "Could not locate the exact Ryubing LibHac source revision $LIBHAC_COMMIT." >&2
            exit 1
          fi

          LIBHAC_PROJECT="$(find .ci-libhac -path '*/LibHac/LibHac.csproj' -print -quit)"
          if [ -z "$LIBHAC_PROJECT" ]; then
            LIBHAC_PROJECT="$(find .ci-libhac -name 'LibHac.csproj' -print -quit)"
          fi
          test -n "$LIBHAC_PROJECT"

          # Never allow this dependency build to fall back to the dead
          # git.ryujinx.app NuGet registry.
          dotnet restore "$LIBHAC_PROJECT" --configfile "$GITHUB_WORKSPACE/nuget.ci.config"
          dotnet pack "$LIBHAC_PROJECT" -c Release --no-restore -o "$GITHUB_WORKSPACE/.packages" \
            -p:PackageId=Ryujinx.LibHac \
            -p:Version=0.21.0-alpha.133

          test -f .packages/Ryujinx.LibHac.0.21.0-alpha.133.nupkg
          ls -la .packages

      - name: Restore RyuSync without git.ryujinx.app
        run: dotnet restore src/Ryujinx/Ryujinx.csproj --configfile nuget.ci.config -r ${{ matrix.rid }}

      - name: Publish Ryujinx
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o publish/${{ matrix.rid }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
