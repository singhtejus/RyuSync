name: RyuSync Builds

on:
  workflow_dispatch:
  push:
    branches:
      - feature/ryusync-netplay-v1

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
            artifact: RyuSync-Windows-x64
          - name: macOS Apple Silicon
            os: macos-14
            rid: osx-arm64
            artifact: RyuSync-macOS-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET version
        run: dotnet --info

      - name: Recover and rebuild pinned LibHac package
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .ci-nextendo .ci-dump .ci-tools .ci-libhac-source .ci-libhac-rebuilt .ci-libhac-pack .packages
          mkdir -p .ci-nextendo .ci-dump .ci-tools .ci-libhac-source .ci-libhac-rebuilt .ci-libhac-pack .packages

          # Nextendo v1.8.8 is built from source that pins exactly
          # Ryujinx.LibHac 0.21.0-alpha.133, matching this RyuSync tree.
          curl -fL --retry 5 --retry-delay 2 \
            -o .ci-nextendo/nextendo.zip \
            https://github.com/NextendoNetwork/Ryujinx-Nextendo/releases/download/v1.8.8/Nextendo-1.8.8-win-x64.zip

          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('.ci-nextendo/nextendo.zip') as z:
              z.extractall('.ci-nextendo/extracted')
          PY

          dotnet tool install --tool-path .ci-tools ilspycmd --version 11.1.0.9782

          found=0
          while IFS= read -r exe; do
            rm -rf .ci-dump/current
            mkdir -p .ci-dump/current
            .ci-tools/ilspycmd -d -o .ci-dump/current "$exe" || true
            libhac="$(find .ci-dump/current -type f \( -iname 'LibHac.dll' -o -iname 'Ryujinx.LibHac.dll' \) -print -quit)"
            if [ -n "$libhac" ]; then
              cp "$libhac" .ci-libhac-pack/LibHac.runtime.dll
              found=1
              break
            fi
          done < <(find .ci-nextendo/extracted -type f -iname '*.exe')

          if [ "$found" -ne 1 ]; then
            echo 'Could not recover LibHac.dll from the verified v1.8.8 bundle.' >&2
            exit 1
          fi

          # The published bundle contains a runtime assembly that references
          # System.Private.CoreLib directly. Decompile and rebuild it against
          # the .NET 10 reference assemblies so Roslyn can consume it normally.
          .ci-tools/ilspycmd -p -o .ci-libhac-source .ci-libhac-pack/LibHac.runtime.dll
          LIBHAC_PROJECT="$(find .ci-libhac-source -name '*.csproj' -print -quit)"
          test -n "$LIBHAC_PROJECT"

          dotnet build "$LIBHAC_PROJECT" -c Release \
            -p:TargetFramework=net10.0 \
            -p:LangVersion=preview \
            -p:AllowUnsafeBlocks=true \
            -o .ci-libhac-rebuilt

          REBUILT_LIBHAC="$(find .ci-libhac-rebuilt -maxdepth 1 -type f -iname 'LibHac.dll' -print -quit)"
          test -n "$REBUILT_LIBHAC"
          cp "$REBUILT_LIBHAC" .ci-libhac-pack/LibHac.dll

          cat > .ci-libhac-pack/Ryujinx.LibHac.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <PackageId>Ryujinx.LibHac</PackageId>
              <Version>0.21.0-alpha.133</Version>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <SuppressDependenciesWhenPacking>true</SuppressDependenciesWhenPacking>
              <PackageRequireLicenseAcceptance>false</PackageRequireLicenseAcceptance>
            </PropertyGroup>
            <ItemGroup>
              <None Include="LibHac.dll" Pack="true" PackagePath="lib/net10.0/" />
            </ItemGroup>
          </Project>
          EOF

          dotnet pack .ci-libhac-pack/Ryujinx.LibHac.csproj -c Release -o .packages
          test -f .packages/Ryujinx.LibHac.0.21.0-alpha.133.nupkg
          ls -la .packages

      - name: Restore RyuSync without git.ryujinx.app
        run: dotnet restore src/Ryujinx/Ryujinx.csproj --configfile nuget.ci.config -r ${{ matrix.rid }}

      - name: Publish Ryujinx
        run: dotnet publish src/Ryujinx/Ryujinx.csproj -c Release -r ${{ matrix.rid }} --self-contained true --no-restore -o publish/${{ matrix.rid }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
